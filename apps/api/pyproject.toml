[project]
name = "ringlark"
version = "1.0.2"
description = "Ringlark: AI SDR setup system (phone callers and follow ups)"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "sendora-core",
  "alembic>=1.14",
  "cryptography>=43",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["psycopg[binary]>=3.2", "pytest>=8", "pytest-cov>=5", "pytest-asyncio>=0.24", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ringlark"]

[tool.coverage.run]
source = ["src/ringlark"]
