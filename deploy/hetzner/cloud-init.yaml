#cloud-config
# Paste into the Cloud config box when you create a Hetzner server. It holds NO secrets: do not add any.
package_update: true
packages:
  - ca-certificates
  - curl
  - git
  - caddy
  - ufw
  - docker.io
  - docker-compose-v2
runcmd:
  # Docker comes from the Ubuntu package archive (signed by the distribution), not from a script piped into a shell.
  - systemctl enable --now docker
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  - mkdir -p /opt/ringlark /var/backups/ringlark
